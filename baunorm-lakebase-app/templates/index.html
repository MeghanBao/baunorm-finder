<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Normen-Nachschlage-Tool (Lakebase)</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    background: #f5f6f7; color: #222;
    max-width: 900px; margin: 0 auto; padding: 24px 16px 60px;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: #888; font-size: 13px; margin-bottom: 18px; }
  input, textarea {
    width: 100%; padding: 10px 14px; font-size: 15px; font-family: inherit;
    border: 1px solid #ccc; border-radius: 8px; margin-bottom: 12px;
  }
  input:focus, textarea:focus { outline: none; border-color: #2563eb; }
  #q { font-size: 16px; padding: 12px 16px; }
  .count { color: #888; font-size: 13px; margin-bottom: 10px; }
  .card {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 10px;
    padding: 14px 18px; margin-bottom: 12px;
  }
  .code-name { font-weight: 600; font-size: 14px; color: #1d4ed8; }
  .article { display: inline-block; background: #eef2ff; color: #4338ca;
    font-size: 12px; padding: 2px 8px; border-radius: 6px; margin-left: 8px; }
  .content { margin-top: 8px; font-size: 14.5px; line-height: 1.6; }
  .value { margin-top: 6px; font-size: 14.5px; font-weight: 600; }
  .note { margin-top: 6px; font-size: 12.5px; color: #b45309; background: #fffbeb;
    padding: 4px 8px; border-radius: 6px; display: inline-block; }
  mark { background: #fef08a; padding: 0 2px; }
  .ask-box { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px;
    padding: 16px 18px; margin-bottom: 20px; }
  .ask-box h2 { font-size: 15px; margin-bottom: 8px; }
  .ask-row { display: flex; gap: 10px; }
  .ask-row input { margin-bottom: 0; }
  .ask-row button { white-space: nowrap; }
  .answer { margin-top: 14px; font-size: 14.5px; line-height: 1.6;
    background: #f0f7ff; border-left: 3px solid #2563eb; padding: 10px 14px;
    border-radius: 6px; white-space: pre-wrap; }
  .cites { margin-top: 12px; }
  .cite { font-size: 13px; padding: 6px 10px; border: 1px solid #e5e7eb;
    border-radius: 8px; margin-bottom: 6px; display: flex; gap: 8px; align-items: center; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
  .badge.verified { background: #dcfce7; color: #166534; }
  .badge.synthetic { background: #fef3c7; color: #92400e; }
  .fb { margin-top: 10px; font-size: 13px; color: #666; }
  .fb button { background: #f3f4f6; color: #333; padding: 4px 10px; font-size: 13px; }
  .disclaimer { margin-top: 8px; font-size: 12px; color: #92400e;
    background: #fffbeb; padding: 6px 10px; border-radius: 6px; }
  .empty { color: #999; text-align: center; padding: 40px 0; }
  details { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px;
    padding: 14px 18px; margin: 18px 0; }
  summary { cursor: pointer; font-weight: 600; font-size: 14px; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  button { padding: 10px 16px; font-size: 14px; border: none; border-radius: 8px;
    background: #2563eb; color: #fff; cursor: pointer; }
  button.secondary { background: #e5e7eb; color: #333; }
  #msg { font-size: 13px; margin-top: 8px; min-height: 16px; }
</style>
</head>
<body>
  <h1>📖 Normen-Nachschlage-Tool <span style="font-size:12px;color:#999">· Lakebase</span></h1>
  <div class="sub">Stichwort eingeben (z. B. Mindestbewehrung), Enter drücken. Daten liegen in Lakebase (Postgres) und werden über diese App gepflegt.</div>

  <div class="ask-box">
    <h2>💬 Fragen (RAG)</h2>
    <div class="ask-row">
      <input id="ask_q" placeholder="Frage stellen, z. B. Was bedeutet feuerbeständig?">
      <button id="ask_btn">Fragen</button>
    </div>
    <div id="ask_out"></div>
  </div>

  <input id="q" placeholder="Stichwortsuche…" autofocus>
  <div class="count" id="count"></div>
  <div id="results"></div>

  <details>
    <summary>➕ Neue Norm erfassen / bearbeiten</summary>
    <div style="margin-top:14px">
      <div class="row">
        <input id="f_norm" placeholder="Norm* (z. B. DIN 4102-2:1977-09)">
        <input id="f_abschnitt" placeholder="Abschnitt (z. B. 6.2.4)">
      </div>
      <input id="f_stichworte" placeholder="Stichworte (mit ; getrennt)">
      <textarea id="f_zusammenfassung" rows="2" placeholder="Zusammenfassung"></textarea>
      <input id="f_wert" placeholder="Wert (Zahl/Formel/Tabelle)">
      <input id="f_anmerkung" placeholder="Anmerkung (Randbedingungen, Quelle)">
      <div class="row" style="align-items:center">
        <button id="save">Speichern</button>
        <button id="seed" class="secondary" title="Einmalig data.csv in Lakebase laden">Aus data.csv seeden</button>
      </div>
      <div id="msg"></div>
    </div>
  </details>

<script>
const $ = id => document.getElementById(id);
let timer = null;

function highlight(text, kw) {
  if (!kw || !text) return text || '';
  const esc = kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp(esc, 'gi'), m => `<mark>${m}</mark>`);
}

async function search(q) {
  if (!q) {
    $('results').innerHTML = '';
    const r = await fetch('/api/search?q=');
    const data = await r.json();
    $('count').textContent = `${data.total} Einträge insgesamt – Suchbegriff eingeben, um zu starten`;
    return;
  }
  const r = await fetch('/api/search?q=' + encodeURIComponent(q));
  const data = await r.json();
  $('count').textContent = `${data.total} Treffer`;
  if (data.total === 0) {
    $('results').innerHTML = '<div class="empty">Keine Treffer. Anderen Suchbegriff versuchen oder neue Norm erfassen.</div>';
    return;
  }
  $('results').innerHTML = data.results.map(r => `
    <div class="card">
      <span class="code-name">${highlight(r.code, q)}</span>
      <span class="article">${highlight(r.article, q)}</span>
      <div class="content">${highlight(r.summary, q)}</div>
      <div class="value">→ ${highlight(r.value, q)}</div>
      ${r.note ? `<div class="note">${r.note}</div>` : ''}
    </div>
  `).join('');
}

$('q').addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(() => search($('q').value.trim()), 150);
});

function esc(s) {
  return (s || '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}

function renderCitations(cites) {
  if (!cites || !cites.length) return '';
  const rows = cites.map(c => {
    const cls = c.is_synthetic ? 'synthetic' : 'verified';
    return `<div class="cite">
      <span class="badge ${cls}">${esc(c.badge)}</span>
      <span><strong>${esc(c.norm)}</strong>${c.abschnitt ? ' · ' + esc(c.abschnitt) : ''}</span>
    </div>`;
  }).join('');
  const hasSynthetic = cites.some(c => c.is_synthetic);
  const warn = hasSynthetic
    ? `<div class="disclaimer">⚠ Enthält synthetische Beispieldaten – kein amtlicher Normwert. Vor Verwendung im Originalnormtext prüfen.</div>`
    : '';
  return `<div class="cites"><div class="count">Quellen:</div>${rows}${warn}</div>`;
}

async function ask() {
  const q = $('ask_q').value.trim();
  if (!q) return;
  $('ask_out').innerHTML = '<div class="answer">Denke nach…</div>';
  try {
    const resp = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ q }),
    });
    const data = await resp.json();
    if (!resp.ok) { $('ask_out').innerHTML = `<div class="disclaimer">Fehler: ${esc(data.error || resp.statusText)}</div>`; return; }
    const fb = data.id != null
      ? `<div class="fb" id="fb">War die Antwort hilfreich?
           <button onclick="rate(${data.id}, 1)">👍</button>
           <button onclick="rate(${data.id}, -1)">👎</button></div>`
      : '';
    $('ask_out').innerHTML = `<div class="answer">${esc(data.answer)}</div>${renderCitations(data.citations)}${fb}`;
  } catch (e) {
    $('ask_out').innerHTML = `<div class="disclaimer">Netzwerkfehler: ${esc(String(e))}</div>`;
  }
}

async function rate(id, rating) {
  await fetch('/api/feedback', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id, rating }),
  });
  const fb = $('fb');
  if (fb) fb.textContent = 'Danke für das Feedback!';
}

$('ask_btn').addEventListener('click', ask);
$('ask_q').addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });

$('save').addEventListener('click', async () => {
  const norm = $('f_norm').value.trim();
  if (!norm) { $('msg').textContent = 'Norm ist erforderlich.'; return; }
  $('msg').textContent = 'Speichere…';
  const resp = await fetch('/api/normen', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      norm,
      abschnitt: $('f_abschnitt').value.trim(),
      stichworte: $('f_stichworte').value.trim(),
      zusammenfassung: $('f_zusammenfassung').value.trim(),
      wert: $('f_wert').value.trim(),
      anmerkung: $('f_anmerkung').value.trim(),
    }),
  });
  const data = await resp.json();
  $('msg').textContent = resp.ok ? `Gespeichert: ${data.entry.code}` : `Fehler: ${data.error || resp.statusText}`;
  if (resp.ok) search($('q').value.trim());
});

$('seed').addEventListener('click', async () => {
  $('msg').textContent = 'Seede aus data.csv…';
  const resp = await fetch('/api/seed', { method: 'POST' });
  const data = await resp.json();
  $('msg').textContent = resp.ok ? `${data.seeded} Einträge geseedet.` : `Fehler: ${data.error || resp.statusText}`;
  search('');
});

search('');
</script>
</body>
</html>
