command:
  - "python"
  - "app.py"

env:
  # Lakebase: lakebase.py resolves the URL from this secret scope/key at runtime
  # (base64-decoded via the Databricks SDK) when LAKEBASE_URL is not already set
  # in the environment.
  - name: LAKEBASE_SECRET_SCOPE
    value: "database"
  - name: LAKEBASE_SECRET_KEY
    value: "lakebase-url"
  - name: NORMEN_TABLE_NAME
    value: "normen"
