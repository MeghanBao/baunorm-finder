command:
  - "python"
  - "app.py"

env:
  # RAG: the Mosaic AI agent serving endpoint the /api/ask route queries
  # (the endpoint databricks.agents.deploy created for this workspace).
  - name: AGENT_SERVING_ENDPOINT
    value: "agents_workspace-ml-baunorm_rag_agent"
  # Lakebase is OFF for this deploy: the RAG chat needs no database. Keyword
  # search / feedback / seed degrade gracefully. To enable later, wire Lakebase
  # and set LAKEBASE_ENABLED=1 (+ the secret scope/key below).
  - name: LAKEBASE_ENABLED
    value: "0"
  - name: LAKEBASE_SECRET_SCOPE
    value: "database"
  - name: LAKEBASE_SECRET_KEY
    value: "lakebase-url"
  - name: NORMEN_TABLE_NAME
    value: "normen"
