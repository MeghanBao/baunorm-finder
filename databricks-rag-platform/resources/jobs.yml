# Retrieval-core pipeline on serverless compute: synthesize -> build index ->
# in-notebook RAG smoke test. No classic job cluster (serverless-only workspace),
# no separate agent Model Serving endpoint (that's the full-workspace variant).
resources:
  jobs:
    baunorm_pipeline:
      name: "[${var.env}] baunorm RAG retrieval-core pipeline"
      tags:
        project: baunorm
        env: ${var.env}
      # No job_clusters: notebook tasks run on serverless automatically.
      parameters:
        - name: env
          default: ${var.env}
        - name: catalog
          default: ${var.catalog}
        - name: embedding_mode
          default: managed
      tasks:
        - task_key: synthesize_corpus
          notebook_task:
            notebook_path: ../notebooks/01_synthesize_corpus.py
            base_parameters:
              env: ${var.env}
              catalog: ${var.catalog}
              embedding_mode: managed

        - task_key: build_index
          depends_on:
            - task_key: synthesize_corpus
          notebook_task:
            notebook_path: ../notebooks/02_build_index.py
            base_parameters:
              env: ${var.env}
              catalog: ${var.catalog}
              embedding_mode: managed

        - task_key: rag_smoke
          depends_on:
            - task_key: build_index
          notebook_task:
            notebook_path: ../notebooks/05_rag_smoke.py
            base_parameters:
              env: ${var.env}
              catalog: ${var.catalog}
              embedding_mode: managed
