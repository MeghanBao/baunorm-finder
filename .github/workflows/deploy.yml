# CI/CD for the baunorm RAG platform (databricks-rag-platform/).
#   * Always: run unit tests.
#   * If DATABRICKS_HOST/DATABRICKS_TOKEN secrets are set: `bundle validate`,
#     and on push to main also `bundle deploy -t staging`.
#   * Without those secrets the Databricks steps are skipped (with a notice) so
#     the pipeline stays green on a fork/clone that has no workspace yet.
name: rag-platform

on:
  push:
    branches: [main]
    paths: ["databricks-rag-platform/**", ".github/workflows/deploy.yml"]
  pull_request:
    paths: ["databricks-rag-platform/**", ".github/workflows/deploy.yml"]

defaults:
  run:
    working-directory: databricks-rag-platform

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: pip install "mlflow-skinny>=2.16.0" numpy pandas pytest
      - name: Unit tests
        run: pytest tests/ -v

  bundle:
    runs-on: ubuntu-latest
    needs: [test]
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for workspace credentials
        id: creds
        run: |
          if [ -n "$DATABRICKS_HOST" ] && [ -n "$DATABRICKS_TOKEN" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DATABRICKS_HOST/DATABRICKS_TOKEN secrets not set — skipping bundle validate/deploy."
          fi
      - uses: databricks/setup-cli@main
        if: steps.creds.outputs.have == 'true'
      - name: Validate bundle
        if: steps.creds.outputs.have == 'true'
        run: databricks bundle validate -t staging
      - name: Deploy to staging
        if: steps.creds.outputs.have == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: databricks bundle deploy -t staging
